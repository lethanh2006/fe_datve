# Chạy cả hệ thống để thử hoặc demo: PostgreSQL + API (build từ repo BE_datve) + web (nginx).
#
#   JWT_SECRET=$(openssl rand -hex 32) docker compose up -d --build
#   # (tuỳ chọn) nạp dữ liệu mẫu và tài khoản admin/khách:
#   docker compose run --rm -e NODE_ENV=development api node scripts/seed.js
#
# Mở http://localhost:8081. Tài khoản mẫu sau khi seed: admin@datve.local / Admin@12345.
# Chưa cấu hình SMTP_URL nên email (đặt lại mật khẩu, vé) không được gửi đi.
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: datve_db
      POSTGRES_USER: datve_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-datve_demo_password}
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datve_user -d datve_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Build thẳng từ GitHub; đổi #master thành tag/commit để cố định phiên bản
    build: https://github.com/lethanh2006/BE_datve.git#master
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_NAME: datve_db
      DB_USERNAME: datve_user
      DB_PASSWORD: ${DB_PASSWORD:-datve_demo_password}
      JWT_SECRET: ${JWT_SECRET:?Cần đặt JWT_SECRET (openssl rand -hex 32)}
      APP_URL: http://localhost:${WEB_PORT:-8081}
      TRUST_PROXY: "true"
    # Áp dụng migration rồi mới nhận request
    command: ["sh", "-c", "node scripts/migrate.js && node dist/main"]

  web:
    build: .
    restart: unless-stopped
    depends_on:
      - api
    environment:
      BACKEND_URL: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"

volumes:
  pg_data:
