# Chạy cả hệ thống để thử hoặc demo: PostgreSQL + API Java (build từ repo BE_ticket) + web (nginx).
#
#   JWT_SECRET=$(openssl rand -hex 32) docker compose up -d --build
#
# Mở http://localhost:8081. API tự chạy migration và tạo dữ liệu mẫu (profile demo):
# user@datve.local / User@12345, admin@datve.local / DEMO_ADMIN_PASSWORD (mặc định Admin@12345).
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: datve_db
      POSTGRES_USER: datve_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-datve_demo_password}
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datve_user -d datve_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Build thẳng từ GitHub; đổi #main thành tag/commit để cố định phiên bản
    build: https://github.com/lethanh2006/BE_ticket.git#main
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: prod,demo
      DB_URL: jdbc:postgresql://postgres:5432/datve_db
      DB_USERNAME: datve_user
      DB_PASSWORD: ${DB_PASSWORD:-datve_demo_password}
      JWT_SECRET: ${JWT_SECRET:?Cần đặt JWT_SECRET (openssl rand -hex 32)}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Admin@12345}

  web:
    build: .
    restart: unless-stopped
    depends_on:
      - api
    environment:
      BACKEND_URL: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"

volumes:
  pg_data:
